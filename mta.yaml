_schema-version: 3.3.0
ID: prac
version: 1.0.0

description: "A simple CAP project."

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom

      commands:
        - npm ci

        - npx cds build --production

modules:
  # --------------------- SERVER MODULE ------------------------

  - name: prac-srv

    type: nodejs

    path: gen/srv

    parameters:
      instances: 1

      memory: 256M

      disk-quota: 1024M

      buildpack: nodejs_buildpack

    build-parameters:
      builder: npm-ci

    provides:
      - name: srv-api

        properties:
          srv-url: ${default-url}

    requires:
      - name: prac-db

  # ----------------    DATABASE DEPLOYER MODULE ----------------

  - name: prac-db-deployer

    type: hdb

    path: gen/db

    requires:
      - name: prac-db

    parameters:
      memory: 256M

      disk-quota: 1024M
      buildpack: nodejs_buildpack

    build-parameters:
      supported-platforms:
        []
        # Ensures proper schema binding on CF server tasks

resources:
  # ----------------- SAP HANA HDI CONTAINER -------------------

  - name: prac-db

    type: com.sap.xs.hdi-container

    parameters:
      service: hana

      service-plan: hdi-shared
